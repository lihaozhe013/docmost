name: Publish

on:
  push:
    branches:
      - publish
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/docmost

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Get version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata for tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,prefix=,format=short

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Delete old GHCR image versions
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: docmost
        shell: bash
        run: |
          set -euo pipefail

          old_version_ids="$({
            gh api --paginate --slurp \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/users/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=100" \
              --jq 'add | sort_by([.created_at, .id]) | reverse | .[3:][] | .id'
          })"

          if [[ -z "$old_version_ids" ]]; then
            echo "No old GHCR package versions to delete."
            exit 0
          fi

          while IFS= read -r version_id; do
            [[ -z "$version_id" ]] && continue

            echo "Deleting GHCR package version $version_id"
            gh api --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/users/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}/versions/${version_id}"
          done <<< "$old_version_ids"
